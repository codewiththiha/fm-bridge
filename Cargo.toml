[package]
name = "fm-bridge"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Async Rust bindings for Apple's on-device Foundation Models, via a Swift helper."
repository = "https://github.com/codewiththiha/fm-bridge"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["apple", "llm", "foundation-models", "ai", "on-device"]
categories = ["api-bindings", "os::macos-apis"]
exclude = ["swift/.build/*", "dist/*"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# Field order steers generation, so JSON objects keep theirs.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.17"
tokio = { version = "1.48", features = ["process", "io-util", "rt", "time", "sync"] }
futures-core = "0.3.31"
async-stream = "0.3.6"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
futures = "0.3.31"
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
